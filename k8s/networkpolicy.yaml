apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hf-llm-api-restrict
  namespace: hf-llm
spec:
  podSelector:
    matchLabels:
      app: hf-llm-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only allow traffic from the ingress-nginx controller and the Prometheus scraper
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow HTTPS out (needed the first time the model downloads from huggingface.co)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
