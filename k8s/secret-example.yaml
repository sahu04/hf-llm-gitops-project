# ============================================================================
# DO NOT commit real secrets as plain Kubernetes Secret YAML to Git.
# This file is a TEMPLATE showing the shape of the secret the Deployment expects.
#
# For a GitOps setup with ArgoCD, use one of these instead:
#   1. Sealed Secrets  (https://github.com/bitnami-labs/sealed-secrets) — encrypts
#      the secret so the ciphertext is safe to commit to Git.
#   2. External Secrets Operator (https://external-secrets.io) — pulls the real
#      secret from AWS Secrets Manager / SSM Parameter Store at deploy time.
#
# For local testing only, you can apply this directly with real values:
#   kubectl create secret generic hf-llm-secret \
#     --namespace hf-llm \
#     --from-literal=api-key='choose-a-strong-random-key-here'
# ============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: hf-llm-secret
  namespace: hf-llm
type: Opaque
stringData:
  api-key: "REPLACE_ME_DO_NOT_COMMIT_REAL_VALUE"
