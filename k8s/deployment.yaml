apiVersion: apps/v1
kind: Deployment
metadata:
  name: hf-llm-api
  namespace: hf-llm
  labels:
    app: hf-llm-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hf-llm-api
  template:
    metadata:
      labels:
        app: hf-llm-api
      annotations:
        # Fallback scrape config if you are NOT using the Prometheus Operator
        # (if you use ServiceMonitor instead, these annotations are optional/ignored)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: hf-llm-sa
      automountServiceAccountToken: false   # least privilege: pod doesn't need the API token
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hf-llm-api
          image: ghcr.io/YOUR_GITHUB_USERNAME/hf-llm-api:latest   # replace with your image
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # HF model cache needs write access; see emptyDir volume below
            capabilities:
              drop: ["ALL"]
          env:
            - name: MODEL_NAME
              value: "distilgpt2"
            - name: MAX_NEW_TOKENS
              value: "50"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: hf-llm-secret
                  key: api-key
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30   # model load takes time on first boot
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 45
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: hf-cache
              mountPath: /app/.cache
      volumes:
        - name: hf-cache
          emptyDir: {}
